name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK de depuração
        run: |
          rm -f local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EstacaoQROffline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EstacaoQROffline-debug.apk
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" EstacaoQROffline-debug.apk --target "$GITHUB_SHA" --title "Estação QR Offline (build ${GITHUB_RUN_NUMBER})" --notes "APK de depuração compilado automaticamente." --prerelease
